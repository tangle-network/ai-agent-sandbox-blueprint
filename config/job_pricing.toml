# This file is not a settlement price. Do not point a pricing engine at it.
#
# On-chain job prices live in the blueprint:
#   AgentSandboxBlueprint.getDefaultJobRates(baseRate)
#   ConfigureJobRates writes them with setJobEventRates.
#
# Jobs 0–4, multipliers against that base:
#   0 SANDBOX_CREATE    50
#   1 SANDBOX_DELETE     1
#   2 WORKFLOW_CREATE    2
#   3 WORKFLOW_TRIGGER   5
#   4 WORKFLOW_CANCEL    1
#
# Operator quotes (operator_quote.rs) may scale that gross by utilization and
# TEE. The chain PaymentSplit still applies to the gross. Instance and TEE
# services are Subscription and do not also charge these workflow rates.
# Off-chain exec, prompt, task, stop, resume, snapshot, SSH, and batch are
# operator HTTP. They are not these five jobs.
