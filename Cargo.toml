[workspace]
resolver = "3"
members = [
    "sandbox-runtime",
    "ai-agent-sandbox-blueprint-lib",
    "ai-agent-sandbox-blueprint-bin",
    "ai-agent-instance-blueprint-lib",
    "ai-agent-instance-blueprint-bin",
    "ai-agent-tee-instance-blueprint-lib",
    "ai-agent-tee-instance-blueprint-bin",
    "bench-harness",
]

[workspace.package]
authors = ["Drew Stone"]
edition = "2024"
description = "AI Agent Sandbox Blueprint"
license = "MIT OR Apache-2.0"

# Reduce debug build sizes (~60-70% smaller binaries)
[profile.dev]
split-debuginfo = "unpacked"  # separate debug info from binaries

[profile.dev.package."*"]
debug = 1  # line tables only for dependencies (not full DWARF)

# Pin the Blueprint SDK graph to the release that carries the 0.19 bindings
# and removes the legacy EigenLayer dependency path.
[patch.crates-io]
# testcontainers 0.23 still requests tokio-tar 0.3.1. Keep its API while
# routing the implementation to the maintained astral-tokio-tar release.
tokio-tar = { path = "vendor/tokio-tar" }
# Keep the libp2p 0.56 API while moving mDNS off vulnerable hickory-proto 0.25.
libp2p-mdns = { path = "vendor/libp2p-mdns" }
# Keep the libp2p 0.56 API while moving DNS resolution to hickory 0.26.
libp2p-dns = { path = "vendor/libp2p-dns" }
# Use the maintained single-protocol yamux adapter instead of yamux 0.12.
libp2p-yamux = { path = "vendor/libp2p-yamux" }
