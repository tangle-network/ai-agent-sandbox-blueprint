name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag: { description: 'Existing tag to (re)build', required: true }

permissions:
  contents: write

jobs:
  release:
    uses: tangle-network/ai-agent-sandbox-blueprint/.github/workflows/release-binaries.yml@main
    permissions:
      contents: write
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  publish-onchain:
    needs: release
    uses: tangle-network/ai-agent-sandbox-blueprint/.github/workflows/publish-onchain.yml@main
    permissions:
      contents: read
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets:
      TNT_CORE_PUBLISH_TOKEN: ${{ secrets.TNT_CORE_PUBLISH_TOKEN }}
