name: Build Nix Profile

# Builds the cacheable toolchain profile defined in flake.nix and pushes
# its closure to the shared `tangle-sandbox` Cachix cache. Downstream CI
# jobs (ci.yml, foundry.yml, …) pull the same closure via cachix-action
# so cold runs don't re-download/compile the Rust toolchain, Foundry,
# clang, openssl, mold, etc. on every push.
#

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'rust-toolchain.toml'
      - 'sidecar/nix/**'
      - '.github/workflows/nix-profile.yml'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'rust-toolchain.toml'
      - 'sidecar/nix/**'
      - '.github/workflows/nix-profile.yml'
  workflow_dispatch:

concurrency:
  group: nix-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, ci-public]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The ci-public runners use the beelink's multi-user Nix daemon (flakes
      # enabled, nixcache.tangle.tools substituter). install-nix-action would
      # try a root install, which the runner user cannot and must not do.
      - name: Use the host Nix daemon
        run: |
          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
          /nix/var/nix/profiles/default/bin/nix --version

      - uses: cachix/cachix-action@v15
        with:
          name: tangle-sandbox
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        if: env.CACHIX_AUTH_TOKEN != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build universal profile
        run: |
          nix build .#default --print-out-paths | tee "$RUNNER_TEMP/profile-path"
          echo "PROFILE_PATH=$(cat "$RUNNER_TEMP/profile-path")" >> "$GITHUB_ENV"

      - name: Build sub-profiles (rust, foundry)
        run: |
          for p in rust foundry; do
            echo "::group::Building $p profile"
            nix build .#$p --print-out-paths
            echo "::endgroup::"
          done

      - name: Build sidecar harness profile
        run: |
          nix flake check ./sidecar/nix --print-build-logs
          nix build ./sidecar/nix#harness-profile --print-out-paths | tee "$RUNNER_TEMP/harness-profile-path"
          echo "HARNESS_PROFILE_PATH=$(cat "$RUNNER_TEMP/harness-profile-path")" >> "$GITHUB_ENV"

      - name: Profile info
        run: |
          nix path-info -S "${{ env.PROFILE_PATH }}" | awk '{printf "Closure: %.1f GB\n", $2/1024/1024/1024}'
          nix path-info -S "${{ env.HARNESS_PROFILE_PATH }}" | awk '{printf "Harness closure: %.1f GB\n", $2/1024/1024/1024}'
          find "${{ env.PROFILE_PATH }}/bin" -mindepth 1 -maxdepth 1 | wc -l | xargs -I{} echo "Binaries: {}"
          find "${{ env.HARNESS_PROFILE_PATH }}/bin" -mindepth 1 -maxdepth 1 | wc -l | xargs -I{} echo "Harness binaries: {}"
          nix path-info -r "${{ env.PROFILE_PATH }}" | wc -l | xargs -I{} echo "Store paths: {}"

      - name: Push to Cachix
        if: github.event_name == 'push' && env.CACHIX_AUTH_TOKEN != ''
        run: |
          nix path-info --recursive \
            "${{ env.PROFILE_PATH }}" \
            "${{ env.HARNESS_PROFILE_PATH }}" \
            | sort -u \
            | cachix push tangle-sandbox
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
