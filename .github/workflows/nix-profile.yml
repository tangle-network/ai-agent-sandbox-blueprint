name: Build Nix Profile

# Verifies the cacheable toolchain profiles in flake.nix and sidecar/nix.
# The provisioned Nix daemon reuses its content-addressed store and configured
# read-only substituters. This qualification job publishes no cache artifacts.

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'rust-toolchain.toml'
      - 'sidecar/nix/**'
      - '.github/workflows/nix-profile.yml'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'rust-toolchain.toml'
      - 'sidecar/nix/**'
      - '.github/workflows/nix-profile.yml'
  workflow_dispatch:

concurrency:
  group: nix-profile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, ci-public]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify the provisioned Nix toolchain
        run: |
          nix_bin=/nix/var/nix/profiles/default/bin
          test -x "$nix_bin/nix"
          printf '%s\n' "$nix_bin" >> "$GITHUB_PATH"
          "$nix_bin/nix" --version

      - name: Build universal profile
        run: |
          nix build .#default --print-out-paths | tee "$RUNNER_TEMP/profile-path"
          echo "PROFILE_PATH=$(cat "$RUNNER_TEMP/profile-path")" >> "$GITHUB_ENV"

      - name: Build sub-profiles (rust, foundry)
        run: |
          for p in rust foundry; do
            echo "::group::Building $p profile"
            nix build .#$p --print-out-paths
            echo "::endgroup::"
          done

      - name: Build sidecar harness profile
        run: |
          nix flake check ./sidecar/nix --print-build-logs
          nix build ./sidecar/nix#harness-profile --print-out-paths | tee "$RUNNER_TEMP/harness-profile-path"
          echo "HARNESS_PROFILE_PATH=$(cat "$RUNNER_TEMP/harness-profile-path")" >> "$GITHUB_ENV"

      - name: Profile info
        run: |
          nix path-info -S "${{ env.PROFILE_PATH }}" | awk '{printf "Closure: %.1f GB\n", $2/1024/1024/1024}'
          nix path-info -S "${{ env.HARNESS_PROFILE_PATH }}" | awk '{printf "Harness closure: %.1f GB\n", $2/1024/1024/1024}'
          find "${{ env.PROFILE_PATH }}/bin" -mindepth 1 -maxdepth 1 | wc -l | xargs -I{} echo "Binaries: {}"
          find "${{ env.HARNESS_PROFILE_PATH }}/bin" -mindepth 1 -maxdepth 1 | wc -l | xargs -I{} echo "Harness binaries: {}"
          nix path-info -r "${{ env.PROFILE_PATH }}" | wc -l | xargs -I{} echo "Store paths: {}"

      - name: Optimize store (hard-link dedup)
        run: nix-store --optimise
