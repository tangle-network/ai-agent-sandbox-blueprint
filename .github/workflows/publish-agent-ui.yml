name: Publish agent-ui to npm

on:
  push:
    tags:
      - 'agent-ui-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (must match packages/agent-ui/package.json)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    uses: tangle-network/ai-agent-sandbox-blueprint/.github/workflows/qualify-agent-ui.yml@0cb5f3cf0ff40f697a57de6863607e7ec1b40c43
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}

  publish:
    needs: prepare
    # npm trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # Node 24 includes npm with trusted publishing support.
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: agent-ui-release
          path: ${{ runner.temp }}/release
      - name: Publish qualified package
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check SHA256SUMS
          npm publish package.tgz --access public --provenance --ignore-scripts
