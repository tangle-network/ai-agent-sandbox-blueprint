name: Sidecar Image

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'sidecar-*'
    paths:
      - sidecar/**
      - .github/workflows/sidecar-image.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      prune_sha_versions_to_keep:
        description: 'How many all-harness-<sha> GHCR versions to keep after publish.'
        required: false
        default: '20'
        type: string

permissions:
  contents: read

concurrency:
  group: sidecar-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tangle-network/ai-agent-sandbox-blueprint'
    uses: tangle-network/ai-agent-sandbox-blueprint/.github/workflows/publish-sidecar.yml@0cb5f3cf0ff40f697a57de6863607e7ec1b40c43
    permissions:
      contents: read
      packages: write
    with:
      prune_sha_versions_to_keep: ${{ inputs.prune_sha_versions_to_keep || '20' }}
