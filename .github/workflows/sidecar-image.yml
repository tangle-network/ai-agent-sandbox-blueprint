name: Sidecar Image

on:
  pull_request:
    branches: [main]
    paths:
      - sidecar/**
      - .github/workflows/sidecar-image.yml
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'sidecar-*'
    paths:
      - sidecar/**
      - .github/workflows/sidecar-image.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      prune_sha_versions_to_keep:
        description: 'How many all-harness-<sha> GHCR versions to keep after publish.'
        required: false
        default: '20'
        type: string

permissions:
  contents: read

concurrency:
  group: sidecar-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dockerfile:
    name: Validate sidecar Dockerfile
    runs-on: [self-hosted, ci-public]
    steps:
      - uses: actions/checkout@v4

      - name: Smoke sidecar terminal API
        run: |
          node --check sidecar/server/server.js
          node --test sidecar/server/*.test.js sidecar/server/*.test.cjs
          sh -n sidecar/scripts/install-harness.sh sidecar/scripts/verify-harnesses.sh
          sidecar/scripts/smoke-terminal-api.sh

      - name: Build all-harness image
        run: |
          docker build \
            -f sidecar/Dockerfile.all-harness \
            -t blueprint-sidecar-all:test .

  publish:
    if: github.event_name != 'pull_request' && github.repository == 'tangle-network/ai-agent-sandbox-blueprint'
    uses: tangle-network/ai-agent-sandbox-blueprint/.github/workflows/publish-sidecar.yml@main
    permissions:
      contents: read
      packages: write
    with:
      prune_sha_versions_to_keep: ${{ inputs.prune_sha_versions_to_keep || '20' }}
