[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
script = "contracts/script"
cache_path = "contracts/cache"
broadcast = "contracts/broadcast"
libs = ["dependencies"]
auto_detect_remappings = true
via_ir = true
optimizer = true
# Hyperliquid (and any EVM enforcing EIP-170 strictly) caps runtime bytecode
# at 24,576 B. Lower optimizer_runs trades a small amount of runtime gas for
# smaller deployment bytecode — `AgentSandboxBlueprint` would otherwise blow
# the cap by several KB even after the library extraction.
optimizer_runs = 1

[soldeer]
recursive_deps = true
remappings_location = "txt"
remappings_version = false

[dependencies]
tnt-core = "0.19.0"
forge-std = "1.9.6"
tangle-slashing = { version = "0.0.0-906b811", git = "https://github.com/tangle-network/tangle-slashing.git", rev = "906b811adfa1bbf53c5c7f7adf3f4bc2a4a119ec" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
